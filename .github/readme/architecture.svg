<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="416" viewBox="0 0 1000 416" role="img" aria-labelledby="title desc">
<title id="title">Eulix architecture</title>
<desc id="desc">Pipeline diagram. eulix-parser (Rust) parses the repository with Tree-sitter, builds the PRISM v2 call graph and writes .eulix/kb*.json. eulix-embed (Python, ETIYA only) embeds chunks with ONNX Runtime or PyTorch into .eulix/embeddings.bin. eulix-cli (Go) routes queries through the ETIYA or EHNAS engine. The MCP server hands ranked context to your AI agent. EHNAS skips the embedding stage.</desc>
<style>.sans{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}.num{font-variant-numeric:tabular-nums}.bg{fill:#f6f8fa;stroke:#d1d9e0}.node{fill:#ffffff;stroke:#d1d9e0}.chip{fill:#f6f8fa;stroke:#d1d9e0}.grid{stroke:#e1e6eb}.axis{stroke:#afb8c1}.ink{fill:#1f2328}.ink2{fill:#59636e}.accent{fill:#6250d6}.trace{fill:none;stroke:#6250d6}.context{fill:#818b98}.flow{fill:none;stroke:#59636e}.head{fill:#59636e}@media (prefers-color-scheme:dark){.bg{fill:#161b22;stroke:#3d444d}.node{fill:#0d1117;stroke:#3d444d}.chip{fill:#161b22;stroke:#3d444d}.grid{stroke:#262c36}.axis{stroke:#545d68}.ink{fill:#f0f6fc}.ink2{fill:#9198a1}.accent{fill:#9085e9}.trace{fill:none;stroke:#9085e9}.context{fill:#656c76}.flow{fill:none;stroke:#9198a1}.head{fill:#9198a1}}</style>
<rect class="bg" x="0.5" y="0.5" width="999" height="415" rx="12"/>
<text x="28" y="44" class="sans ink" font-size="18" font-weight="600">From repository to agent context</text>
<text x="28" y="68" class="sans ink2" font-size="13">One Go binary ships the Rust parser and the Python embedder. Everything runs on your machine.</text>
