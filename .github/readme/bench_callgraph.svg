<svg xmlns="http://www.w3.org/2000/svg" width="800" height="343" viewBox="0 0 800 343" role="img" aria-labelledby="title desc">
<title id="title">How many call-graph edges are right</title>
<desc id="desc">Bar chart: 98.6% of the call edges PRISM v2 draws are correct, against 54.6% for PRISM v1, at similar recall (58.6% and 57.0%), on eight open-source projects checked against each language&#x27;s own compiler tooling.</desc>
<style>.sans{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}.num{font-variant-numeric:tabular-nums}.bg{fill:#f6f8fa;stroke:#d1d9e0}.node{fill:#ffffff;stroke:#d1d9e0}.chip{fill:#f6f8fa;stroke:#d1d9e0}.grid{stroke:#e1e6eb}.axis{stroke:#afb8c1}.ink{fill:#1f2328}.ink2{fill:#59636e}.accent{fill:#6250d6}.trace{fill:none;stroke:#6250d6}.context{fill:#818b98}.flow{fill:none;stroke:#59636e}.head{fill:#59636e}@media (prefers-color-scheme:dark){.bg{fill:#161b22;stroke:#3d444d}.node{fill:#0d1117;stroke:#3d444d}.chip{fill:#161b22;stroke:#3d444d}.grid{stroke:#262c36}.axis{stroke:#545d68}.ink{fill:#f0f6fc}.ink2{fill:#9198a1}.accent{fill:#9085e9}.trace{fill:none;stroke:#9085e9}.context{fill:#656c76}.flow{fill:none;stroke:#9198a1}.head{fill:#9198a1}}</style>
<rect class="bg" x="0.5" y="0.5" width="799" height="342" rx="12"/>
<text x="28" y="44" class="sans ink" font-size="18" font-weight="600">How many call-graph edges are right</text>
<text x="28" y="68" class="sans ink2" font-size="13">Precision on 8 open-source projects, one per language, checked against each language's own compiler tooling ·</text>
<text x="28" y="86" class="sans ink2" font-size="13">higher is better</text>
<line class="axis" x1="224" y1="116" x2="224" y2="232" stroke-width="1"/>
<text x="224" y="252" class="sans ink2 num" font-size="12" text-anchor="middle">0%</text>
<line class="grid" x1="342" y1="116" x2="342" y2="232" stroke-width="1"/>
<text x="342" y="252" class="sans ink2 num" font-size="12" text-anchor="middle">25%</text>
<line class="grid" x1="460" y1="116" x2="460" y2="232" stroke-width="1"/>
<text x="460" y="252" class="sans ink2 num" font-size="12" text-anchor="middle">50%</text>
<line class="grid" x1="578" y1="116" x2="578" y2="232" stroke-width="1"/>
<text x="578" y="252" class="sans ink2 num" font-size="12" text-anchor="middle">75%</text>
<line class="grid" x1="696" y1="116" x2="696" y2="232" stroke-width="1"/>
<text x="696" y="252" class="sans ink2 num" font-size="12" text-anchor="middle">100%</text>
<text x="210" y="143" class="sans ink" font-size="14" font-weight="600" text-anchor="end">PRISM v2</text>
<text x="210" y="160" class="sans ink2" font-size="12" text-anchor="end">87 of 6,355 edges wrong</text>
<path class="accent" d="M224,133H685.4A4,4 0 0 1 689.4,137V153A4,4 0 0 1 685.4,157H224Z"/>
<text x="699.4" y="150" class="sans ink" font-size="14" font-weight="600">98.6%</text>
<text x="210" y="201" class="sans ink" font-size="14" font-weight="600" text-anchor="end">PRISM v1</text>
<text x="210" y="218" class="sans ink2" font-size="12" text-anchor="end">5,060 of 11,153 edges wrong</text>
<path class="context" d="M224,191H477.7A4,4 0 0 1 481.7,195V211A4,4 0 0 1 477.7,215H224Z"/>
<text x="491.7" y="208" class="sans ink" font-size="14" font-weight="600">54.6%</text>
<text x="28" y="284" class="sans ink2" font-size="12">Both find about the same share of the real calls (v2 58.6%, v1 57.0%): v2 leaves an edge out rather than guess. 10,694</text>
<text x="28" y="301" class="sans ink2" font-size="12">reference call pairs from gin, gson, flask, ripgrep, class-validator, axios, cJSON and tinyxml2. Per-language results in</text>
<text x="28" y="318" class="sans ink2" font-size="12">docs/libeulix/Call-Graph-Accuracy.md.</text>
</svg>
