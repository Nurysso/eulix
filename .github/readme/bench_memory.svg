<svg xmlns="http://www.w3.org/2000/svg" width="800" height="308" viewBox="0 0 800 308" role="img" aria-labelledby="title desc">
<title id="title">MCP server memory by retrieval engine</title>
<desc id="desc">Horizontal bar chart. ETIYA uses 947 MB (range 930 to 964). EHNAS uses 85 MB (range 81 to 89), about 11 times less memory.</desc>
<style>.sans{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}.num{font-variant-numeric:tabular-nums}.bg{fill:#f6f8fa;stroke:#d1d9e0}.node{fill:#ffffff;stroke:#d1d9e0}.chip{fill:#f6f8fa;stroke:#d1d9e0}.grid{stroke:#e1e6eb}.axis{stroke:#afb8c1}.ink{fill:#1f2328}.ink2{fill:#59636e}.accent{fill:#6250d6}.trace{fill:none;stroke:#6250d6}.context{fill:#818b98}.flow{fill:none;stroke:#59636e}.head{fill:#59636e}@media (prefers-color-scheme:dark){.bg{fill:#161b22;stroke:#3d444d}.node{fill:#0d1117;stroke:#3d444d}.chip{fill:#161b22;stroke:#3d444d}.grid{stroke:#262c36}.axis{stroke:#545d68}.ink{fill:#f0f6fc}.ink2{fill:#9198a1}.accent{fill:#9085e9}.trace{fill:none;stroke:#9085e9}.context{fill:#656c76}.flow{fill:none;stroke:#9198a1}.head{fill:#9198a1}}</style>
<rect class="bg" x="0.5" y="0.5" width="799" height="307" rx="12"/>
<text x="28" y="44" class="sans ink" font-size="18" font-weight="600">MCP server memory by retrieval engine</text>
<text x="28" y="68" class="sans ink2" font-size="13">Whole server process tree · eulix v0.9.0 on five repos (eulix, flask, gin, ripgrep, gson) · MB, lower is better</text>
<line class="axis" x1="224" y1="98" x2="224" y2="214" stroke-width="1"/>
<text x="224" y="234" class="sans ink2 num" font-size="12" text-anchor="middle">0</text>
<line class="grid" x1="342" y1="98" x2="342" y2="214" stroke-width="1"/>
<text x="342" y="234" class="sans ink2 num" font-size="12" text-anchor="middle">250</text>
<line class="grid" x1="460" y1="98" x2="460" y2="214" stroke-width="1"/>
<text x="460" y="234" class="sans ink2 num" font-size="12" text-anchor="middle">500</text>
<line class="grid" x1="578" y1="98" x2="578" y2="214" stroke-width="1"/>
<text x="578" y="234" class="sans ink2 num" font-size="12" text-anchor="middle">750</text>
<line class="grid" x1="696" y1="98" x2="696" y2="214" stroke-width="1"/>
<text x="696" y="234" class="sans ink2 num" font-size="12" text-anchor="middle">1,000 MB</text>
<text x="210" y="125" class="sans ink" font-size="14" font-weight="600" text-anchor="end">ETIYA</text>
<text x="210" y="142" class="sans ink2" font-size="12" text-anchor="end">range 930–964 MB</text>
<path class="context" d="M224,115H667A4,4 0 0 1 671,119V135A4,4 0 0 1 667,139H224Z"/>
<text x="681" y="132" class="sans ink" font-size="14" font-weight="600">947 MB</text>
<text x="210" y="183" class="sans ink" font-size="14" font-weight="600" text-anchor="end">EHNAS</text>
<text x="210" y="200" class="sans ink2" font-size="12" text-anchor="end">range 81–89 MB</text>
<path class="accent" d="M224,173H260.1A4,4 0 0 1 264.1,177V193A4,4 0 0 1 260.1,197H224Z"/>
<text x="274.1" y="190" class="sans ink" font-size="14" font-weight="600">85 MB</text>
<text x="329.1" y="190" class="sans ink2" font-size="13">about 11× less memory</text>
<text x="28" y="266" class="sans ink2" font-size="12">Bars mark the midpoint of each engine's range across the five repos. ETIYA's figure includes its Python embedding helper;</text>
<text x="28" y="283" class="sans ink2" font-size="12">EHNAS loads no model at all.</text>
</svg>
