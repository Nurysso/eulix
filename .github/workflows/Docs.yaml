name: Docs

# Weekly health check of docs/:
# - stale external links (Sphinx linkcheck)
# - broken internal links, anchors and pages missing from the toctree (Sphinx build)
# - spelling (codespell)
# If any check fails, a single "Docs check failed" issue is opened (or commented on
# if it is already open), because failures of scheduled runs are otherwise easy to miss.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-check
  cancel-in-progress: true

jobs:
  external-links:
    name: Stale external links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: linkcheck
        working-directory: docs
        run: uv run --with-requirements requirements.txt sphinx-build -E -b linkcheck . _build/linkcheck
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linkcheck-report
          path: docs/_build/linkcheck/output.txt

  internal-links:
    name: Internal links, anchors and structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build (warnings are errors)
        working-directory: docs
        run: uv run --with-requirements requirements.txt sphinx-build -W --keep-going -E -b html . _build/html

  spelling:
    name: Spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: codespell
        working-directory: docs
        run: uv run --with-requirements requirements.txt codespell .

  report:
    name: Open issue on failure
    needs: [external-links, internal-links, spelling]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: "Docs check failed"
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update issue
        run: |
          body="The weekly docs check failed: $RUN_URL

          Results: external links: ${{ needs.external-links.result }}, internal links: ${{ needs.internal-links.result }}, spelling: ${{ needs.spelling.result }}.
          The linkcheck report is attached to the run as \`linkcheck-report\`."
          existing=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
