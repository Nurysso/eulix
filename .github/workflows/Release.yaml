name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # manual run: builds everything, only tag runs publish a release

env:
  GO_VERSION: '1.27'
  RUST_VERSION: 'stable'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Built once, reused by every matrix leg and by the release.
  prepare:
    name: Package eulix-embed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Create eulix-embed.zip
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error title=Packaging eulix-embed failed::$1"; exit 1; }

          [ -d eulix-embed ] || fail "Directory 'eulix-embed/' not found in the repo root. Was it renamed or moved?"

          zip -r eulix-embed.zip eulix-embed/ \
            -x "*/.venv/*" "*.venv*" \
               "*/.ruff_cache/*" "*.ruff_cache*" \
               "*/.pytest_cache/*" "*.pytest_cache*" \
               "*/.mypy_cache/*" "*.mypy_cache*" \
               "*/.git/*" "*.git*" \
               "*/__pycache__/*" "*__pycache__*" \
               "*.pyc" \
               "*/.codespell-ignore" "*.codespell-ignore" \
            || fail "'zip' failed while archiving eulix-embed/. See the log above."

          [ -s eulix-embed.zip ] || fail "eulix-embed.zip was created but is empty."

      - uses: actions/upload-artifact@v4
        with:
          name: embed-zip
          path: eulix-embed.zip
          if-no-files-found: error

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false # one platform failing must not hide the result of the others
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            rust_target: x86_64-unknown-linux-gnu
            rustflags: ''
            parser_src: eulix_parser
            parser_embed: eulix_parser_linux
            ext: ''
            variants: 'amd nvidia'

          - name: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            rust_target: x86_64-pc-windows-msvc
            rustflags: '-C link-arg=advapi32.lib' # rpmalloc needs advapi32
            parser_src: eulix_parser.exe
            parser_embed: eulix_parser_windows.exe
            ext: '.exe'
            variants: 'amd nvidia'

          - name: macos-arm64 # Apple Silicon (M series)
            runner: macos-14
            goos: darwin
            goarch: arm64
            rust_target: aarch64-apple-darwin
            rustflags: ''
            parser_src: eulix_parser
            parser_embed: eulix_parser_darwin
            ext: ''
            variants: 'amd' # NVIDIA/CUDA doesn't exist on Apple Silicon

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        id: setup_go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: eulix-cli/go.sum

      - name: Setup Rust
        id: setup_rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: ${{ matrix.rust_target }}
          cache: false
          rustflags: ''

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: eulix-parser -> target
          key: ${{ matrix.rust_target }}

      - name: Build eulix-parser
        id: parser
        working-directory: ./eulix-parser
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          set -euo pipefail
          echo "Building parser for ${{ matrix.rust_target }}..."
          cargo build --release --target "${{ matrix.rust_target }}" || {
            echo "::error title=Rust parser build failed (${{ matrix.name }})::cargo could not compile eulix-parser for ${{ matrix.rust_target }}. The compiler error is in this step's log."
            exit 1
          }

          bin="target/${{ matrix.rust_target }}/release/${{ matrix.parser_src }}"
          [ -f "$bin" ] || {
            echo "::error title=Parser binary missing (${{ matrix.name }})::cargo succeeded but '$bin' does not exist. Check that the binary name in Cargo.toml is still 'eulix_parser'."
            exit 1
          }

      - name: Stage parser and embed archive
        id: stage
        run: |
          set -euo pipefail
          fail() { echo "::error title=Staging failed (${{ matrix.name }})::$1"; exit 1; }

          bins=eulix-cli/internal/assets/bins
          mkdir -p "$bins" dist
          src="eulix-parser/target/${{ matrix.rust_target }}/release/${{ matrix.parser_src }}"

          cp "$src" "$bins/${{ matrix.parser_embed }}" || fail "Could not copy $src into $bins."
          cp "$src" "dist/eulix-parser-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" \
            || fail "Could not copy parser into dist/."

      - name: Download eulix-embed.zip
        uses: actions/download-artifact@v4
        with:
          name: embed-zip
          path: eulix-cli/internal/assets/bins

      - name: Hash parser binary
        id: hash
        run: |
          set -euo pipefail
          f="eulix-cli/internal/assets/bins/${{ matrix.parser_embed }}"
          [ -f "$f" ] || { echo "::error title=Hashing failed (${{ matrix.name }})::$f not found."; exit 1; }

          if command -v sha256sum >/dev/null 2>&1; then
            h=$(sha256sum "$f" | awk '{print $1}')
          else
            h=$(shasum -a 256 "$f" | awk '{print $1}')   # macOS
          fi
          [ -n "$h" ] || { echo "::error title=Hashing failed (${{ matrix.name }})::Empty sha256 for $f."; exit 1; }

          echo "${{ matrix.parser_embed }}: $h"
          echo "parser_hash=$h" >> "$GITHUB_OUTPUT"

      - name: Build eulix (Go)
        id: gobuild
        working-directory: ./eulix-cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          PARSER_HASH: ${{ steps.hash.outputs.parser_hash }}
        run: |
          set -euo pipefail
          echo "Using $(go version)"

          for tag in ${{ matrix.variants }}; do
            req_file="onnx-${tag}.txt"
            out="$GITHUB_WORKSPACE/dist/eulix-${{ matrix.goos }}-${{ matrix.goarch }}-onnx-${tag}${{ matrix.ext }}"
            echo "Building ONNX '${tag}' variant (embed_requirements=${req_file})..."

            go build \
              -ldflags="-s -w -X 'eulix/internal/assets.embed_requirements=${req_file}' -X 'eulix/internal/assets.ParserHash=${PARSER_HASH}'" \
              -trimpath -o "$out" ./cmd/eulix/main.go || {
              echo "::error title=Go build failed (${{ matrix.name }}, variant ${tag})::'go build' failed. Common causes: missing file in internal/assets/bins (the //go:embed target for this OS), a compile error, or an invalid Go version. See the log above."
              exit 1
            }

            [ -s "$out" ] || { echo "::error title=Go build failed (${{ matrix.name }})::Output $out is missing or empty."; exit 1; }
          done

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

      - name: Failure summary
        if: failure()
        run: |
          {
            echo "### ❌ Build failed: ${{ matrix.name }}"
            echo ""
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| Setup Go | ${{ steps.setup_go.outcome }} |"
            echo "| Setup Rust | ${{ steps.setup_rust.outcome }} |"
            echo "| Build parser | ${{ steps.parser.outcome }} |"
            echo "| Stage files | ${{ steps.stage.outcome }} |"
            echo "| Hash parser | ${{ steps.hash.outcome }} |"
            echo "| Go build | ${{ steps.gobuild.outcome }} |"
            echo ""
            echo "The first row that is not \`success\` is where it broke. Open that step's log for the exact error."
          } >> "$GITHUB_STEP_SUMMARY"

  create-release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/') # manual runs on a branch never publish
    permissions:
      contents: write
    steps:
      - name: Download all build outputs
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: release_assets

      - name: Download eulix-embed.zip
        uses: actions/download-artifact@v4
        with:
          name: embed-zip
          path: release_assets

      - name: Checksums
        working-directory: release_assets
        run: |
          set -euo pipefail
          count=$(ls | wc -l)
          # 6 CLI binaries (2 linux, 2 windows, 1 mac) ... adjust if you change the matrix
          echo "Found $count files:"; ls -l
          [ "$count" -gt 0 ] || { echo "::error title=No release assets::release_assets/ is empty."; exit 1; }
          sha256sum * > checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release_assets/*
