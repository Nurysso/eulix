corpus = "django"
kind = "trace"
prompt = "Trace how Django resolves a request URL to a view function, step by step."
truth = "BaseHandler.get_response -> _get_response -> resolve_request (core/handlers/base.py:302) -> get_resolver(urlconf) -> URLResolver.resolve -> pattern.match / URLPattern.resolve -> ResolverMatch."
