# Tasks for the agent token-savings benchmark (bench/agent/agent_bench.py).
#
# Each task is a question a developer would ask a coding agent on a repo it has
# never seen. The same prompt goes to both arms; only the tools differ.
#
# Grading: the final answer passes when every [[task.require]] group matches.
# A group matches when ANY of its regexes (case-insensitive) is found in the
# answer. Ground truth was checked by hand against the pinned commit; the line
# references in `truth` are for reviewers, not for grading.
schema = 1

[[corpus]]
name = "flask"
source = "https://github.com/pallets/flask"
commit = "22d924701a6ae2e4cd01e9a15bbaf3946094af65"
tag = "3.1.3"

[[corpus]]
name = "django"
source = "https://github.com/django/django"
commit = "f16e25dcb9fe55734ba4ea2b00ac34405b7df74a"
tag = "6.1.3"

[[corpus]]
name = "ripgrep"
source = "https://github.com/BurntSushi/ripgrep"
commit = "e89fff89ac9af12e8d4ce9d5fd07beb408ca730f"
tag = "15.2.0"

# A repo the model is unlikely to know well: a young, fast-moving Go project
# pinned to a commit newer than any training data. .claude/ holds the project's
# own agent skills; it is removed so no arm can load them.
[[corpus]]
name = "bifrost"
source = "https://github.com/maximhq/bifrost"
commit = "783c682951a1c4d6a07a677779e0becab8bbbe2c"
tag = "dev@2026-11-19"
exclude = [".claude/"]

# ---------------------------------------------------------------- flask

[[task]]
id = "flask-session-signing"
corpus = "flask"
kind = "where"
prompt = "Where is the session cookie signed, and which key derivation and digest does it use?"
truth = "src/flask/sessions.py: SecureCookieSessionInterface.get_signing_serializer builds an itsdangerous URLSafeTimedSerializer, key_derivation='hmac', digest_method=_lazy_sha1 (SHA-1), salt 'cookie-session'."
require = [
  ["sessions\\.py"],
  ["get_signing_serializer"],
  ["sha-?1"],
  ["hmac"],
]

[[task]]
id = "flask-callers-handle-user-exception"
corpus = "flask"
kind = "callers"
prompt = "What calls Flask.handle_user_exception?"
truth = "Only Flask.full_dispatch_request (src/flask/app.py:919), in its `except Exception` branch."
require = [
  ["full_dispatch_request"],
]

[[task]]
id = "flask-trace-request"
corpus = "flask"
kind = "trace"
prompt = "Trace how an incoming WSGI request reaches a view function in Flask, step by step."
truth = "Flask.__call__ -> wsgi_app -> request_context().push() -> full_dispatch_request -> preprocess_request -> dispatch_request -> view_functions[rule.endpoint] -> finalize_request."
require = [
  ["wsgi_app"],
  ["full_dispatch_request"],
  ["dispatch_request"],
  ["view_functions"],
]

[[task]]
id = "flask-config-default"
corpus = "flask"
kind = "lookup"
prompt = "Where is the default value of SESSION_COOKIE_NAME defined, and what is it?"
truth = "Flask.default_config in src/flask/app.py:190, value 'session'. A literal-string lookup: grep is expected to do well here."
require = [
  ["app\\.py", "default_config"],
  ["[\"'`]session[\"'`]"],
]

# ---------------------------------------------------------------- django

[[task]]
id = "django-csrf-check"
corpus = "django"
kind = "where"
prompt = "Where does Django check the CSRF token on a POST request, and how does it compare the tokens?"
truth = "django/middleware/csrf.py: CsrfViewMiddleware.process_view -> _check_token -> _does_token_match, which unmasks and calls constant_time_compare."
require = [
  ["csrf\\.py", "CsrfViewMiddleware"],
  ["_check_token", "process_view"],
  ["constant_time_compare"],
]

[[task]]
id = "django-callers-fetch-all"
corpus = "django"
kind = "callers"
prompt = "What calls QuerySet._fetch_all in Django's ORM?"
truth = "django/db/models/query.py: QuerySet.__len__, __iter__, __bool__, __getitem__ (single index), __getstate__; RawQuerySet.__len__/__bool__/__iter__ (around line 2491). Also prefetch paths call it on other querysets."
