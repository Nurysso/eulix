# Corpora for the call-graph accuracy harness (bench/callgraph/cg_eval.py).
#
# Three real corpora per language, pinned to a 40-hex commit (moving a pin
# invalidates its cached reference call sites), plus a tiny "micro" fixture per
# language under micro/ that runs in seconds and doubles as a smoke test for the
# reference tools.
#
# lang     go | java | python | rust | ts | js | c | cpp   (picks the reference tool)
# set      real | micro
# source   git URL, or "micro" (path = directory under bench/callgraph/)
# subdir   analyse only this directory of the checkout (both eulix and the reference)
# exclude  paths deleted from the snapshot before anything runs
# ref_args extra arguments for the reference tool (clang: compiler flags)
# PHP has no corpus: there is no PHP toolchain in the reference set (see README).
schema = 1

