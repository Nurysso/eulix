# Frozen code every eulix version is measured on.
#
# A corpus is pinned to a 40-hex commit, never a branch. Moving a pin
# invalidates that corpus's saved results, so do it on purpose. To pin an
# outside repo, take its latest stable release tag and peel it:
#     git ls-remote <url> 'refs/tags/<tag>^{}'
#
# source   "self" (this repo's history) or a git URL
# measures which result groups run on it: indexing, retrieval, query, parser
# embed    false: index with `eulix parser` only (no embedding, no etiya)
# exclude  deleted from the snapshot. They must be physically gone: the grep
#          fallback reads files on disk and v0.8.3 ignores .euignore there.
# euignore_extra  appended to the `eulix init` default .euignore
schema = 1

[[corpus]]
name = "eulix"
source = "self"
commit = "f9006ea89ea2dc134cdc0b55ca798c13e071b5ea"  # dev, 2026-11-13
tier = "default"
measures = ["indexing", "retrieval", "query", "parser"]
questions = "questions/eulix.toml"
# Files that quote the benchmark questions, so retrieval can't "find" the answer
# in the question list, plus config the harness writes itself.
exclude = [
  "eulix.toml", ".euignore", ".eulix/", "docs/", "bench/",
  "scripts/eval_mcp.py", "scripts/retrival_eval.py", "scripts/check_embed_*.py",
  "eulix-cli/internal/query/retrieval/long_chunk_test.go",
  "**/*eval_results*.json",
]
euignore_extra = ["script-test-dump/"]

