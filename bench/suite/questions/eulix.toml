# Retrieval questions about the eulix corpus (bench/suite/corpora.toml).
#
# id         stable, never reused for a different question
# component  report grouping only
# style      code: uses the identifiers and terms in the target code
#            plain: describes behaviour without the target code's words
# text       the question sent to `query_without_cot`
# expect     path prefixes; a hit is the first result whose file starts with one.
#            Omit for a latency-only question.
#
# Phrase questions "How does/is/are ...": shorter "where is X" / "who calls X"
# questions hit direct-answer classes in the query router and skip retrieval.
# Changing a question's text or expect makes it a new question (new hash).
schema = 1

# From scripts/eval_mcp.py CASES["ehnas"]: written while developing EHNAS.
[[q]]
id = "go-apply-budget"
component = "go-cli"
style = "code"
text = "How does applyBudget work"
expect = ["eulix-cli/internal/query/retrieval/intent.go"]

