[mypy]
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unreachable = True
no_implicit_optional = True
strict_equality = True
check_untyped_defs = True

; Full strict mode is often unrealistic against torch/ijson stubs quickly;
; start here and ratchet up per-module as coverage improves.
disallow_untyped_defs = False
disallow_incomplete_defs = True

; Third-party libs in play here (torch, ijson, orjson) frequently lack
; complete stubs — don't let missing stubs block the whole run, but do
; still type-check the code that calls them.
[mypy-torch.*]
ignore_missing_imports = True

[mypy-ijson.*]
ignore_missing_imports = True

[mypy-orjson.*]
ignore_missing_imports = True

[mypy-sentence_transformers.*]
ignore_missing_imports = True

[mypy-tqdm.*]
ignore_missing_imports = True

[mypy-onnxruntime.*]
ignore_missing_imports = True

[mypy-optimum.onnxruntime.*]
ignore_missing_imports = True

[mypy-transformers.*]
ignore_missing_imports = True

; The core embedding/batching/quantization logic is the highest-value place
; for strict checking — shape and dtype bugs here corrupt output silently.
[mypy-eulix_embed.embed.*]
disallow_untyped_defs = True

[mypy-eulix_embed.quantize.*]
disallow_untyped_defs = True
