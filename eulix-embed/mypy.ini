[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unreachable = True
no_implicit_optional = True
strict_equality = True
check_untyped_defs = True
; Full strict mode is often unrealistic against torch stubs quickly;
; start here and ratchet up per-module as coverage improves.
disallow_untyped_defs = False
disallow_incomplete_defs = True

; Third-party libs in play here (torch, orjson) frequently lack
; complete stubs — don't let missing stubs block the whole run, but do
; still type-check the code that calls them.
[mypy-torch.*]
ignore_missing_imports = True

[mypy-orjson.*]
ignore_missing_imports = True

[mypy-sentence_transformers.*]
ignore_missing_imports = True

[mypy-tqdm.*]
ignore_missing_imports = True

[mypy-onnxruntime.*]
ignore_missing_imports = True

[mypy-optimum.onnxruntime.*]
ignore_missing_imports = True

[mypy-transformers.*]
ignore_missing_imports = True

; flatc's generated code (fb/, scripts/gen_flatbuffers.sh) is unannotated;
; resolve its imports but don't report errors inside it.
[mypy-fb.*]
follow_imports = silent
ignore_errors = True

; The core embedding/batching/quantization logic is the highest-value place
; for strict checking — shape and dtype bugs here corrupt output silently.
[mypy-embedders.*]
disallow_untyped_defs = True

[mypy-data_io.binary]
disallow_untyped_defs = True
