[package]
name = "eulix-parser"
version = "0.8.0"
edition = "2021"
description = "Fast, secure code parser for multiple languages using tree-sitter"
readme = "README.md"
repository = "https://github.com/Nurysso/eulix/tree/main/eulix-parser"
license = "GPL-3.0-or-later"
keywords = ["code-analysis", "parser", "static-analysis", "tree-sitter"]
categories = ["development-tools", "parsing"]

[package.metadata.docs.rs]
features = ["secure"]
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-audit]
ignore = []

[[bin]]
name = "eulix_parser"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }

# Tree-sitter parsing core
tree-sitter = "=0.27.0"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-go = "=0.25.0"
tree-sitter-java = "=0.23.5"
tree-sitter-javascript = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"

rayon = "1.8"

serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["raw_value"] }

chrono = { version = "0.4", default-features = false, features = [
    "now",
    "serde",
] }
ignore = "0.4"
regex = { version = "1.10", default-features = false, features = [
    "perf",
    "std",
] }

anyhow = "1.0"
indicatif = "0.18.4"
memmap2 = "0.9.11"
num_cpus = { version = "1.17.0", optional = true }
rpmalloc = "0.2.2"
rustc-hash = "2.1.3"
secrecy = { version = "0.10.3", optional = true }
xxhash-rust = { version = "0.8.18", features = ["const_xxh3", "xxh3"] }
zstd = "0.14.0"
crc32fast = "1.5.2"

# Unix only: getrusage for max_rss_mb()
[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[dev-dependencies]
tempfile = "3.9"

[build-dependencies]
cc = { version = "1.0", optional = true }

[features]
default = ["num_cpus"]
num_cpus = ["dep:num_cpus"]
secure = ["secrecy"]
simd = ["ignore/simd-accel"]
system = []
dev = ["serde_json/arbitrary_precision"]

[lints.clippy]
arithmetic_side_effects = "allow"
cargo = { level = "warn", priority = -1 }
expect_used = "warn"
float_arithmetic = "allow"
large_stack_arrays = "warn"
modulo_arithmetic = "warn"
nursery = { level = "allow", priority = -1 }
panic = "warn"
pedantic = { level = "allow", priority = -1 }
print_stderr = "allow"
print_stdout = "allow"
todo = "deny"
unwrap_used = "warn"

[lints.rust]
unsafe-code = "allow"
unused-crate-dependencies = "warn"

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true
incremental = true
codegen-units = 256

[profile.release]
opt-level = 3
strip = "symbols"
overflow-checks = false
lto = "fat"
panic = "abort"
incremental = false
codegen-units = 1

[profile.min-size]
inherits = "release"
opt-level = "z"
strip = "symbols"
lto = "fat"
panic = "abort"
codegen-units = 1

[profile.secure]
inherits = "release"
opt-level = 2
debug-assertions = true
overflow-checks = true
incremental = false
