[package]
name = "eulix-parser"
version = "0.7.4"
edition = "2021"
description = "Fast, secure code parser for multiple languages using tree-sitter"
readme = "README.md"
repository = "https://github.com/Nurysso/eulix"
license = "GPLV3"
keywords = ["code-analysis", "parser", "static-analysis", "tree-sitter"]
categories = ["development-tools", "parsing"]

[package.metadata.docs.rs]
features = ["secure"]
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-audit]
ignore = []  # List ignored advisories if needed

[[bin]]
name = "eulix_parser"
path = "src/main.rs"

# Benchmark configuration
# [[bench]]
# harness = false
# name = "parser"

[dependencies]
# CLI parsing - fast and minimal
clap = { version = "4.6.1", features = ["derive"] }

# Tree-sitter parsing core
tree-sitter = "0.20"

tree-sitter-c = "0.20"
tree-sitter-cpp = "0.20"
tree-sitter-go = "0.20"
# tree-sitter-javascript = "0.20"
# Language grammars (minimal features)
tree-sitter-python = "0.20"
tree-sitter-rust = "0.20"
tree-sitter-typescript = "0.20"  # Also covers TSX

# Add more languages as needed (commented for reference)
# tree-sitter-java = "0.20"
# tree-sitter-ruby = "0.20"
# tree-sitter-php = "0.20"

rayon = "1.8"

# Serialization with zero-copy when possible
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["raw_value"] }

anyhow = "1.0"
chrono = {
  version = "0.4",
  default-features = false,
  features = ["now", "serde"]
}
ignore = "0.4"
regex = {
  version = "1.10",
  default-features = false,
  features = ["perf", "std"]
}

indicatif = "0.18.4"
# jemallocator = { version = "0.5", optional = true }
libc = "0.2.186"
memmap2 = "0.9.11"
mimalloc = { version = "0.1.50", features = ["secure"] }
num_cpus = { version = "1.17.0", optional = true }
rustc-hash = "2.1.3"
secrecy = { version = "0.8", optional = true }  # For sensitive data handling
sonic-rs = "0.5.8"

# [dev-dependencies]
# criterion = { version = "0.5", features = ["html_reports"] }
# pretty_assertions = "1.4"
# tempfile = "3.9"

[build-dependencies]
cc = { version = "1.0", optional = true }  # For building grammars if needed

# Feature flags for different use cases
[features]
num_cpus = ["dep:num_cpus"]
secure = ["secrecy"]
simd = ["ignore/simd-accel"]
system = []  # Use system allocator

# Development features (slower, more debugging)
dev = ["serde_json/arbitrary_precision"]

# Disable SIMD for compatibility
no-simd = []

[lints.clippy]
arithmetic_side_effects = "allow"
cargo = { level = "warn", priority = -1 }
expect_used = "warn"
float_arithmetic = "allow"
large_stack_arrays = "warn"
modulo_arithmetic = "warn"
nursery = { level = "allow", priority = -1 }
panic = "warn"
pedantic = { level = "allow", priority = -1 }
print_stderr = "allow"
print_stdout = "allow"
todo = "deny"
unwrap_used = "warn"

[lints.rust]
unsafe-code = "allow"
unused-crate-dependencies = "warn"

# Profile configurations
[profile.dev]
opt-level = 0
debug = true
overflow-checks = true
incremental = true
codegen-units = 256

[profile.release]
opt-level = 3
strip = "symbols"
overflow-checks = false
lto = "fat"
panic = "abort"
incremental = false
codegen-units = 1

# Profile for minimal binary size
[profile.min-size]
inherits = "release"
opt-level = "z"  # Optimize for size
strip = "symbols"
lto = "fat"
panic = "abort"
codegen-units = 1

# Profile for maximum security
[profile.secure]
inherits = "release"
opt-level = 2
debug-assertions = true
overflow-checks = true
incremental = false
