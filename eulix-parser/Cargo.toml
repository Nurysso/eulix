[package]
name = "eulix-parser"
version = "0.7.2"
edition = "2021"
authors = ["dawood Nurysso@proton.me"]
description = "Fast, secure code parser for multiple languages using tree-sitter"
license = "GPLV3"
repository = "https://github.com/Nurysso/eulix"
readme = "README.md"
keywords = ["code-analysis", "parser", "static-analysis", "tree-sitter"]
categories = ["development-tools", "parsing"]

[package.metadata.docs.rs]
features = ["secure"]
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-audit]
ignore = []  # List ignored advisories if needed

[[bin]]
name = "eulix_parser"
path = "src/main.rs"

# Benchmark configuration
# [[bench]]
# harness = false
# name = "parser"

[dependencies]
# CLI parsing - fast and minimal
clap = { version = "4.6.1", features = ["derive"] }

# Tree-sitter parsing core
tree-sitter = "0.20"

tree-sitter-c = "0.20"
tree-sitter-cpp = "0.20"
tree-sitter-go = "0.20"
# tree-sitter-javascript = "0.20"
# Language grammars (minimal features)
tree-sitter-python = "0.20"
tree-sitter-rust = "0.20"
tree-sitter-typescript = "0.20"  # Also covers TSX

# Add more languages as needed (commented for reference)
# tree-sitter-java = "0.20"
# tree-sitter-ruby = "0.20"
# tree-sitter-php = "0.20"

# Parallel processing - optimized for work-stealing
rayon = "1.8"

# Serialization with zero-copy when possible
serde = {version = "1.0",features = ["derive", "rc"]}
serde_json = {version = "1.0",features = ["raw_value"]}

ignore = "0.4"
# File system operations with security
# walkdir = "2.4"

# Utilities with performance focus
anyhow = "1.0"
chrono = {version = "0.4",default-features = false,features = ["now", "serde"]}
once_cell = "1.19"  # Better than lazy_static
regex = {version = "1.10",default-features = false,features = ["perf", "std"]}

jemallocator = { version = "0.5", optional = true }
# Memory optimizations
mimalloc = { version = "*", features = ["secure"]  }

# Security hardening
secrecy = { version = "0.8", optional = true }  # For sensitive data handling
sonic-rs = "0.5.8"
indicatif = "0.18.4"
libc = "0.2.186"
memmap2 = "0.9.11"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
pretty_assertions = "1.4"
tempfile = "3.9"

[build-dependencies]
cc = { version = "1.0", optional = true }  # For building grammars if needed

# Feature flags for different use cases
[features]
# default = ["mimalloc", "simd"]  # Best all-around allocator

# jemalloc = ["dep:jemallocator"]
# Memory allocators (pick one)
# mimalloc = ["dep:mimalloc"]
# Security features
secure = ["secrecy"]
simd = ["ignore/simd-accel"]
system = []  # Use system allocator

# Development features (slower, more debugging)
dev = ["serde_json/arbitrary_precision"]

# Disable SIMD for compatibility
no-simd = []

[lints.clippy]
cargo = "warn"
expect_used = "warn"
float_arithmetic = "warn"
integer_arithmetic = "warn"
large_stack_arrays = "warn"
modulo_arithmetic = "warn"
nursery = "warn"
panic = "warn"
pedantic = "warn"
print_stderr = "warn"
print_stdout = "warn"
stack_array_size = "warn"
todo = "forbid"
unwrap_used = "warn"

# Linting configuration for security
[lints.rust]
missing-docs = "warn"
unsafe-code = "warn"
unused-crate-dependencies = "warn"

# Profile configurations
[profile.dev]
opt-level = 0
debug = true
overflow-checks = true  # Catch integer overflows in debug
incremental = true
codegen-units = 256

[profile.release]
opt-level = 3
strip = "symbols"  # Remove debug symbols
overflow-checks = false  # Release assumes no overflows
lto = "fat"  # Better than "thin" for performance
panic = "abort"  # Smaller binaries, no unwinding overhead
incremental = false
codegen-units = 1  # Maximum optimization

# Profile for minimal binary size
[profile.min-size]
inherits = "release"
opt-level = "z"  # Optimize for size
strip = "symbols"
lto = "fat"
panic = "abort"
codegen-units = 1

# Profile for maximum security
[profile.secure]
inherits = "release"
opt-level = 2  # Slightly less aggressive for safety
debug-assertions = true  # Keep debug assertions
overflow-checks = true  # Catch overflows even in release
incremental = false
