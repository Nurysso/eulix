[package]
name = "eulix-parser"
version = "0.9.0"
edition = "2021"
rust-version = "1.74"
description = "multi-language code parsing and call-graph builder"
documentation = "https://docs.rs/eulix-parser"
repository = "https://github.com/Nurysso/eulix/tree/main/eulix-parser"
readme = "README.md"
license = "Apache-2.0"
keywords = [
    "code-analysis",
    "parser",
    "static-analysis",
    "tree-sitter",
    "call-graph",
]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "eulix_parser"
path = "src/main.rs"

[dependencies]
libeulix = { path = "../libeulix", version = "0.9.0" }

clap = { version = "4.5", features = ["derive"] }
indicatif = "0.18"
memmap2 = "0.9"
rpmalloc = "0.2"
rustc-hash = "2.1"
crc32fast = "1.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = "0.14"

serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
chrono = { version = "0.4", default-features = false, features = ["now"] }
rayon = "1.10"
num_cpus = { version = "1.17.0", optional = true }

[features]
default = ["num_cpus"]
num_cpus = ["dep:num_cpus"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
