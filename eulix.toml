# Eulix Configuration
[project]
path = "."
Max_Lines = 300
DebugConfig = true

[parser]
threads = 4
prismVersion = 2

[embeddings]
model = "microsoft/codebert-base"
dimension = 768

[llm]
local = false
provider = "fireworks"
model = "accounts/fireworks/models/deepseek-v4-pro"
max_tokens = 20000
temperature = 0.1
# baseURL = "http://localhost:11434"

[cache]
[cache.redis]
enabled = false
url = "redis://localhost:6379"
ttl_hours = 6

[cache.sql]
enabled = true
driver = "sqlite"
dsn = ".eulix/history.db"

[checksum]
change_threshold = 0.10
force_reanalyze_threshold = 0.30
