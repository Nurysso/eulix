# Eulix Configuration
[project]
path = "."
Max_Lines = 300
DebugConfig = true

[parser]
threads = 4
prismVersion = 2

[embeddings]
model = "microsoft/codebert-base"
dimension = 768

[llm]
local = true
provider = "ollama"
model = "qwen2.5-coder:7b"
max_tokens = 8192
temperature = 0.4
baseURL = "http://localhost:11434"

[cache]
[cache.redis]
enabled = false
url = "redis://localhost:6379"
ttl_hours = 6

[cache.sql]
enabled = true
driver = "sqlite"
dsn = ".eulix/history.db"

[checksum]
change_threshold = 0.10
force_reanalyze_threshold = 0.30
