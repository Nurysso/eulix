<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Call Graph Explorer</title>
<style>
:root{--bg:#fff;--bg2:#f5f5f3;--bg3:#ebebe8;--tx:#1c1c1a;--tx2:#6b6b66;--bd:#d8d8d3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1a;--bg2:#242423;--bg3:#2f2f2d;--tx:#ececea;--tx2:#9a9a94;--bd:#3d3d3a}}
:root[data-theme="dark"]{--bg:#1b1b1a;--bg2:#242423;--bg3:#2f2f2d;--tx:#ececea;--tx2:#9a9a94;--bd:#3d3d3a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:var(--bg);color:var(--tx)}
#app{display:flex;flex-direction:column;height:100%}
#top{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--bd);background:var(--bg2);flex-wrap:wrap}
#top b{font-weight:600}
label.btn,button{padding:5px 11px;font:inherit;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);cursor:pointer}
label.btn{background:#7F77DD;border-color:#7F77DD;color:#fff}
button:hover{background:var(--bg3)}
#status{color:var(--tx2);flex:1;min-width:120px}
#main{flex:1;display:flex;min-height:0}
#side{width:270px;flex-shrink:0;border-right:1px solid var(--bd);background:var(--bg2);display:flex;flex-direction:column}
#side .sec{padding:8px 10px;border-bottom:1px solid var(--bd);display:flex;flex-direction:column;gap:6px}
input[type=text],select{width:100%;padding:5px 7px;font:inherit;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)}
.row{display:flex;gap:6px}
#list{flex:1;overflow-y:auto}
.it{padding:5px 10px;cursor:pointer;border-left:2px solid transparent}
.it:hover{background:var(--bg3)}.it.on{border-left-color:#7F77DD;background:var(--bg3)}
.it .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .f{color:var(--tx2);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg{display:flex;flex-wrap:wrap;gap:4px 10px;color:var(--tx2);font-size:10px}
.lg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
#wrap{flex:1;position:relative;min-width:0;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--tx2);line-height:1.8;padding:20px;pointer-events:none}
#det{position:absolute;top:8px;right:8px;width:260px;max-height:calc(100% - 40px);overflow-y:auto;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;display:none;line-height:1.5}
#det h4{font-size:13px;word-break:break-all}
#det .k{color:var(--tx2);font-size:10px;text-transform:uppercase;margin-top:8px}
#det .c{cursor:pointer;color:#378ADD;word-break:break-all;padding:1px 0}
#det .c:hover{text-decoration:underline}
#det .tag{display:inline-block;background:var(--bg3);border-radius:4px;padding:0 5px;margin:1px 2px 1px 0;font-size:10px}
#bar{position:absolute;left:0;right:0;bottom:0;padding:5px 10px;font-size:10px;color:var(--tx2);background:var(--bg2);border-top:1px solid var(--bd);display:flex;gap:14px}
#drop{outline:2px dashed #7F77DD;outline-offset:-6px}
@media(max-width:700px){#side{width:170px}#det{width:200px}}
</style></head>
<body><div id="app">
<div id="top">
  <b>⬡ Call Graph Explorer</b>
  <label class="btn">Load JSON files<input id="file" type="file" accept=".json,application/json" multiple hidden></label>
  <span id="status">Select <i>*_call_graph.json</i> and optionally <i>*_index.json</i> (or drop them here). Parsed locally, nothing is uploaded.</span>
</div>
<div id="main">
  <div id="side">
    <div class="sec">
      <input id="q" type="text" placeholder="Search name or file…">
      <select id="fcat"><option value="">All categories</option></select>
      <select id="ftag"><option value="">All tags</option></select>
      <div class="row">
        <select id="dir"><option value="both">both ways</option><option value="callees">callees →</option><option value="callers">← callers</option></select>
        <select id="depth"><option>1</option><option selected>2</option><option>3</option></select>
      </div>
      <button id="reset">Reset view</button>
    </div>
    <div class="sec lg" id="lg"></div>
    <div id="list"></div>
  </div>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div id="hint">Load a call graph to begin.<br>Default view = most-connected nodes.<br>Click: details · Double-click: focus neighborhood · Drag: pan / move · Scroll: zoom</div>
    <div id="det"></div>
    <div id="bar"><span id="i1"></span><span id="i2"></span></div>
  </div>
</div></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KINDS='func|fn|method|type|struct|class|interface|var|const|file|module|package';
const ID_RE=new RegExp('^('+KINDS+')_(.*?)::(.*)$','s'), ID2=new RegExp('^('+KINDS+')_(.+)$','s');
const TYPE_MAP={func:'function',fn:'function',method:'method',type:'type',struct:'type',class:'type',interface:'type'};
const COL={function:'#7F77DD',method:'#1D9E75',type:'#EF9F27',file:'#378ADD',module:'#378ADD',package:'#378ADD',external:'#888780'};
const ECOL={calls:'#378ADD',imports:'#1D9E75',depends_on:'#D4537E'};
const MAXV=400, TOP=80;
let G=null, IDX=null, vis=[], visE=[], focus=null, sel=null;
let pan={x:0,y:0}, zoom=1, alpha=0, dirty=true, dragN=null, panning=false, down=null;

// "func_Name::path/to/file.go" -> parts
function parseId(id){
  let m=id.match(ID_RE); if(m) return {kind:m[1],name:m[2],file:m[3]};
  m=id.match(ID2); return m?{kind:m[1],name:m[2],file:''}:{kind:'',name:id,file:''};
}
const ntype=n=>n.ext?'external':(COL[n.type]?n.type:(TYPE_MAP[n.type]||'external'));

function buildGraph(d){
  const nodes=new Map(), out=new Map(), inn=new Map(), etypes=new Set();
  const get=(id,ext)=>{let n=nodes.get(id);if(!n){const p=parseId(id);n={id,name:p.name,file:p.file,type:p.kind,ext,deg:0,x:0,y:0,vx:0,vy:0};nodes.set(id,n);out.set(id,[]);inn.set(id,[]);}return n;};
  for(const s of d.nodes||[]){const n=get(s.id,false);n.ext=false;if(s.name)n.name=s.name;if(s.node_type)n.type=s.node_type;if(s.file)n.file=s.file;}
  let ne=0;
  for(const e of d.edges||[]){
    const a=get(e.from,true), b=get(e.to,true), t=e.edge_type||'calls'; etypes.add(t);
    out.get(a.id).push({n:b,t,c:!!e.conditional}); inn.get(b.id).push({n:a,t,c:!!e.conditional});
    a.deg++;b.deg++;ne++;
  }
  return {nodes,out,inn,etypes,ne};
}
function buildIndex(ix){
  const tagsOf=new Map(), fileCat=new Map();
  for(const [t,arr] of Object.entries(ix.functions_by_tag||{})) for(const v of arr){(tagsOf.get(v)||tagsOf.set(v,[]).get(v)).push(t);}
  for(const [c,arr] of Object.entries(ix.files_by_category||{})) for(const f of arr) fileCat.set(f,c);
  return {ix,tagsOf,fileCat,tagSets:Object.fromEntries(Object.entries(ix.functions_by_tag||{}).map(([k,v])=>[k,new Set(v)]))};
}
const tagsFor=n=>IDX?[...new Set([...(IDX.tagsOf.get(n.name)||[]),...(IDX.tagsOf.get(n.id)||[])])]:[];
const catFor=n=>IDX&&n.file?(IDX.fileCat.get(n.file)||null):null;
function matches(n){
  const q=$('q').value.trim().toLowerCase(), c=$('fcat').value, t=$('ftag').value;
  if(q&&!(n.name.toLowerCase().includes(q)||n.file.toLowerCase().includes(q)))return false;
  if(c&&catFor(n)!==c)return false;
  if(t&&!(IDX&&(IDX.tagSets[t].has(n.name)||IDX.tagSets[t].has(n.id))))return false;
  return true;
}

async function loadFiles(files){
  for(const f of files){
    try{
      status(`Reading ${f.name} (${(f.size/1048576).toFixed(1)} MB)…`); await new Promise(r=>setTimeout(r,30));
      const d=JSON.parse(await f.text());
      status(`Indexing ${f.name}…`); await new Promise(r=>setTimeout(r,30));
      if(Array.isArray(d.nodes)||Array.isArray(d.edges)){G=buildGraph(d);}
      else if(d.indices||d.functions_by_name||d.functions_calling){IDX=buildIndex(d.indices||d);fillFilters();}
      else status(`${f.name}: unrecognized structure (expected nodes/edges or indices).`);
    }catch(e){status(`Failed to load ${f.name}: ${e.message}`);return;}
  }
  if(G){$('hint').style.display='none';focus=null;sel=null;showDet(null);rebuild();
    status(`Loaded graph${IDX?' + index':''}.`);}
}
const status=s=>$('status').textContent=s;
function fillFilters(){
  const ix=IDX.ix, f=(id,keys)=>{const s=$(id);const first=s.options[0];s.innerHTML='';s.appendChild(first);keys.sort().forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k;s.appendChild(o);});};
  f('fcat',Object.keys(ix.files_by_category||{})); f('ftag',Object.keys(ix.functions_by_tag||{}));
}

function rebuild(){
  if(!G)return;
  const adj=(n,d)=>d==='callees'?G.out.get(n.id):d==='callers'?G.inn.get(n.id):G.out.get(n.id).concat(G.inn.get(n.id));
  let arr;
  if(focus){
    const seen=new Map([[focus.id,focus]]), dir=$('dir').value, depth=+$('depth').value; let fr=[focus];
    for(let d=0;d<depth&&seen.size<MAXV;d++){const nx=[];
      for(const n of fr)for(const {n:m} of adj(n,dir)){if(seen.size>=MAXV)break;if(!seen.has(m.id)){seen.set(m.id,m);nx.push(m);}}
      fr=nx;}
    arr=[...seen.values()];
  } else arr=[...G.nodes.values()].filter(matches).sort((a,b)=>b.deg-a.deg).slice(0,TOP);
  vis=arr; const set=new Set(arr); visE=[];
  for(const n of arr)for(const e of G.out.get(n.id))if(set.has(e.n))visE.push({s:n,t:e.n,ty:e.t,c:e.c});
  const W=$('wrap').clientWidth,H=$('wrap').clientHeight; pan={x:0,y:0};zoom=1;
  arr.forEach((n,i)=>{const a=i/arr.length*6.283,r=Math.min(W,H)*(0.15+0.3*Math.random());n.x=W/2+Math.cos(a)*r;n.y=H/2+Math.sin(a)*r;n.vx=n.vy=0;});
  if(focus){focus.x=W/2;focus.y=H/2;}
  alpha=1;dirty=true;buildList();buildLegend();
  $('i1').textContent=`${G.nodes.size.toLocaleString()} nodes · ${G.ne.toLocaleString()} edges total`;
  $('i2').textContent=`showing ${vis.length} nodes · ${visE.length} edges${focus?' · focus: '+focus.name:' · top by connections'}${vis.length>=MAXV?' (capped)':''}`;
}
function buildLegend(){
  const t=[...new Set(vis.map(ntype))], e=[...G.etypes];
  $('lg').innerHTML=t.map(k=>`<span><i style="background:${COL[k]}"></i>${k}</span>`).join('')+
    e.map(k=>`<span><i style="background:${ECOL[k]||'#888780'};border-radius:0;height:2px;vertical-align:middle"></i>${esc(k)}</span>`).join('')+
    '<span><i style="background:none;border:2px solid #E24B4A"></i>no callers</span>';
}
function buildList(){
  if(!G)return;
  const items=[]; for(const n of G.nodes.values())if(matches(n))items.push(n);
  items.sort((a,b)=>b.deg-a.deg);
  $('list').innerHTML=items.slice(0,150).map(n=>`<div class="it${sel&&sel.id===n.id?' on':''}" data-id="${esc(n.id)}"><div class="n">${esc(n.name)} <span style="color:var(--tx2);font-weight:400">·${n.deg}</span></div><div class="f">${esc(n.file||'(no file)')}</div></div>`).join('')+
    (items.length>150?`<div class="it f">+${items.length-150} more — refine search</div>`:'');
}

function showDet(n){
  const el=$('det'); if(!n){el.style.display='none';return;}
  const o=G.out.get(n.id), i=G.inn.get(n.id), L=(a,k)=>a.slice(0,40).map(e=>`<div class="c" data-id="${esc(e.n.id)}">${esc(e.n.name)}${e.c?' ?':''}</div>`).join('')+(a.length>40?`<div>+${a.length-40} more</div>`:'');
  let h=`<h4>${esc(n.name)}</h4><div style="color:var(--tx2)">${esc(ntype(n))}${n.file?' · '+esc(n.file):''}</div>`;
  if(IDX){
    const locs=(IDX.ix.functions_by_name||{})[n.name]||[], tg=tagsFor(n), cat=catFor(n);
    if(cat)h+=`<div class="k">category</div><span class="tag">${esc(cat)}</span>`;
    if(tg.length)h+=`<div class="k">tags</div>`+tg.map(t=>`<span class="tag">${esc(t)}</span>`).join('');
    if(locs.length)h+=`<div class="k">locations (index)</div>`+locs.slice(0,15).map(l=>`<div>${esc(l)}</div>`).join('');
    const ic=(IDX.ix.functions_calling||{})[n.name]||[];
    if(!i.length&&ic.length)h+=`<div class="k">callers (index)</div>`+ic.slice(0,30).map(c=>`<div>${esc(c)}</div>`).join('');
    const ty=(IDX.ix.types_by_name||{})[n.name]; if(ty)h+=`<div class="k">type defs</div>`+ty.slice(0,10).map(l=>`<div>${esc(l)}</div>`).join('');
  }
  h+=`<div class="k">calls → ${o.length}</div>${L(o)}<div class="k">called by ← ${i.length}</div>${L(i)}`;
  h+=`<div style="margin-top:8px"><button id="fbtn">Focus neighborhood</button></div>`;
  el.innerHTML=h; el.style.display='block';
  $('fbtn').onclick=()=>focusOn(n);
}
function focusOn(n){focus=n;sel=n;showDet(n);rebuild();}

// === simulation ===
function tick(){
  const N=vis.length, W=$('wrap').clientWidth/2, H=$('wrap').clientHeight/2;
  for(let i=0;i<N;i++){const a=vis[i];
    for(let j=i+1;j<N;j++){const b=vis[j];let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy;if(d2<25)d2=25;
      const f=3500/d2,d=Math.sqrt(d2);dx=dx/d*f;dy=dy/d*f;a.vx+=dx;a.vy+=dy;b.vx-=dx;b.vy-=dy;}
    a.vx+=(W-a.x)*0.008;a.vy+=(H-a.y)*0.008;}
  for(const e of visE){const dx=e.t.x-e.s.x,dy=e.t.y-e.s.y,d=Math.sqrt(dx*dx+dy*dy)||1,f=(d-110)*0.03;
    e.s.vx+=dx/d*f;e.s.vy+=dy/d*f;e.t.vx-=dx/d*f;e.t.vy-=dy/d*f;}
  for(const n of vis){if(n===dragN){n.vx=n.vy=0;continue;}n.vx*=0.6;n.vy*=0.6;n.x+=n.vx*alpha*0.5;n.y+=n.vy*alpha*0.5;}
  alpha*=0.985;
}
const R=n=>6+Math.min(12,Math.sqrt(n.deg)*2.2);
function draw(){
  const cv=$('c'),ctx=cv.getContext('2d'),dpr=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);}
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(dpr*zoom,0,0,dpr*zoom,pan.x*dpr,pan.y*dpr);
  const cs=getComputedStyle(document.documentElement), tx=cs.getPropertyValue('--tx').trim()||'#222', tx2=cs.getPropertyValue('--tx2').trim()||'#777';
  const nb=new Set(); if(sel&&G){nb.add(sel.id);for(const e of G.out.get(sel.id))nb.add(e.n.id);for(const e of G.inn.get(sel.id))nb.add(e.n.id);}
  const hasSel=!!sel;
  for(const e of visE){
    const act=!hasSel||e.s===sel||e.t===sel; ctx.globalAlpha=act?0.9:0.1;
    const col=ECOL[e.ty]||'#888780',dx=e.t.x-e.s.x,dy=e.t.y-e.s.y,len=Math.sqrt(dx*dx+dy*dy)||1,ux=dx/len,uy=dy/len,r=R(e.t);
    const x1=e.s.x+ux*R(e.s),y1=e.s.y+uy*R(e.s),x2=e.t.x-ux*r,y2=e.t.y-uy*r;
    ctx.setLineDash(e.c?[5/zoom,4/zoom]:[]);ctx.strokeStyle=col;ctx.lineWidth=1.3/zoom;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([]);
    const hs=7/zoom,a=Math.atan2(dy,dx);ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x2,y2);
    ctx.lineTo(x2-Math.cos(a-0.4)*hs,y2-Math.sin(a-0.4)*hs);ctx.lineTo(x2-Math.cos(a+0.4)*hs,y2-Math.sin(a+0.4)*hs);ctx.fill();
  }
  ctx.textAlign='center';ctx.textBaseline='top';
  for(const n of vis){
    const act=!hasSel||nb.has(n.id), r=R(n), dim=!matches(n)&&focus; ctx.globalAlpha=act?(dim?0.4:1):0.2;
    ctx.beginPath();ctx.arc(n.x,n.y,r,0,6.283);ctx.fillStyle=COL[ntype(n)];ctx.fill();
    const noCallers=G.inn.get(n.id).length===0&&G.out.get(n.id).length>0;
    ctx.lineWidth=(n===sel?3:noCallers?2:1)/zoom;ctx.strokeStyle=n===sel?tx:noCallers?'#E24B4A':'rgba(0,0,0,.25)';ctx.stroke();
    if(zoom>0.5||vis.length<60||nb.has(n.id)&&hasSel){
      ctx.fillStyle=tx;ctx.font=`${11/zoom}px ui-monospace,monospace`;
      ctx.fillText(n.name.length>26?n.name.slice(0,25)+'…':n.name,n.x,n.y+r+2/zoom);
    }
  }
  ctx.globalAlpha=1;
}
function loop(){ if(alpha>0.01){tick();dirty=true;} if(dirty&&G){draw();dirty=false;} requestAnimationFrame(loop);}
loop();

// === interaction ===
const cv=$('c');
const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
const world=p=>({x:(p.x-pan.x)/zoom,y:(p.y-pan.y)/zoom});
function nodeAt(p){const w=world(p);for(let i=vis.length-1;i>=0;i--){const n=vis[i],dx=n.x-w.x,dy=n.y-w.y,r=R(n)+2;if(dx*dx+dy*dy<r*r)return n;}return null;}
cv.addEventListener('pointerdown',e=>{if(!G)return;cv.setPointerCapture(e.pointerId);const p=pos(e);down={x:p.x,y:p.y};dragN=nodeAt(p);panning=!dragN;});
cv.addEventListener('pointermove',e=>{
  const p=pos(e);
  if(down&&dragN){const w=world(p);dragN.x=w.x;dragN.y=w.y;alpha=Math.max(alpha,0.15);dirty=true;}
  else if(down&&panning){pan.x+=e.movementX;pan.y+=e.movementY;dirty=true;}
  else if(G){cv.style.cursor=nodeAt(p)?'pointer':'default';}
});
cv.addEventListener('pointerup',e=>{
  if(!down)return;const p=pos(e),moved=Math.hypot(p.x-down.x,p.y-down.y)>4;
  if(!moved){const n=nodeAt(p);sel=n&&sel&&sel.id===n.id?null:n;showDet(sel);buildList();}
  down=null;dragN=null;panning=false;dirty=true;
});
cv.addEventListener('dblclick',e=>{const n=nodeAt(pos(e));if(n)focusOn(n);});
cv.addEventListener('wheel',e=>{e.preventDefault();const p=pos(e),w=world(p);zoom=Math.max(0.1,Math.min(6,zoom*(e.deltaY<0?1.12:0.89)));pan.x=p.x-w.x*zoom;pan.y=p.y-w.y*zoom;dirty=true;},{passive:false});
document.addEventListener('click',e=>{const t=e.target.closest('[data-id]');if(!t||!G)return;const n=G.nodes.get(t.dataset.id);if(n)focusOn(n);});
let qt;['q','fcat','ftag'].forEach(id=>$(id).addEventListener('input',()=>{clearTimeout(qt);qt=setTimeout(()=>{buildList();if(!focus)rebuild();else dirty=true;},200);}));
['dir','depth'].forEach(id=>$(id).addEventListener('change',()=>{if(focus)rebuild();}));
$('reset').onclick=()=>{focus=null;sel=null;showDet(null);['q','fcat','ftag'].forEach(i=>$(i).value='');rebuild();};
$('file').addEventListener('change',e=>{loadFiles([...e.target.files]);e.target.value='';});
addEventListener('dragover',e=>{e.preventDefault();document.body.id='drop';});
addEventListener('dragleave',()=>document.body.id='');
addEventListener('drop',e=>{e.preventDefault();document.body.id='';loadFiles([...e.dataTransfer.files]);});
addEventListener('resize',()=>{dirty=true;});
</script></body></html>
